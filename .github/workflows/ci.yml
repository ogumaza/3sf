# SPDX-License-Identifier: MIT

# Builds 3SF and runs ctest whenever main changes: on macOS ARM64, and on Windows x64 and x86 with clang-cl. The x86
# job covers the 32-bit foobar2000 component. All three jobs build the component. The x86 job also builds the XMPlay
# plugin. XMPlay is 32-bit only.
# Changes to documentation alone don't start a run.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (clang-cl)
            os: windows-2025
            cmake: -A x64 -T ClangCL
            foobar2000: true
          - name: Windows x86 (clang-cl)
            os: windows-2025
            cmake: -A Win32 -T ClangCL
            foobar2000: true
            xmplay: true
          - name: macOS ARM64 (Apple Clang)
            os: macos-15
            foobar2000: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./externals/xsflib/ci/build-and-test
        with:
          cmake: ${{ matrix.cmake }}
          foobar2000: ${{ matrix.foobar2000 }}
          foobar2000-version: "2026-09-17"
          foobar2000-sha256: 24fa95ed66b42624f593fd4b94c5efb08ae81dfebb92b79fe69c8cd170961e48
          xmplay: ${{ matrix.xmplay || false }}
          test-timeout: 600
